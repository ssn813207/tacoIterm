<body>
    <header>
        <h1>Little Taco Shop</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/#about">About LTS</a></li>
                <li><a href="/#menu">Our Menu</a></li>

        <figure>
            <img src="img/pexels-thishanabee-3642718.jpg"
             alt="两个盘子里分别装着四个taco和调料" title="旁边还有一个饮料"
             width="520" height="370">
              <figcaption>Little Taco Shop</figcaption>
        </figure>    
    </header>

    <main>
       <h2>Our Conact Form</h2>
       <section>
            <form action="https://httpbin.org/get" method="get">                
                <fieldset>
                    <legend>Send Us A Message</legend>
                    <p>
                        <label for="name">姓名</label>
                        <input type="text" name="name" id="name" placeholder="张三" autocomplete="on"
                        required autofocus>
                    </p>
                    <p>
                        <label for="email">邮箱</label>
                        <input type="email" name="email" id="email" placeholder="邮箱" autocomplete="on"
                        required >
                    </p>
                    <p>
                        <label for="Message">Your Message:</label>
                        <br>
                        <textarea name="Message" id="Message" 
                        cols="30" rows="10" placeholder="Type your message here"></textarea>                        
                    </p>
                </fieldset>
                <br>
                <button type="submit">Send</button>
                <button type="reset">Reset</button>
            </form>
        </section>    
        
        <section>
            <h2>Our Location</h2>
                    <address>
                        555 Taco Temptation Lane,Suite T<br>
                        Kansas City,MO 55555-55555
                     </address>
                     <br><br>
                phone:<a href="tel:+555555555">555-555-555</a>
                <p><a href="#">回到顶部</a></p>
        </section>    
    </main>
    <hr>
    <footer>
       <p>Copright&copy;The Little Taco Shop</p>
